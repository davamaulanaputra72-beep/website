<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page Animasi gelombang</title>
    <link rel="stylesheet" href="styles css2.css">
</head>
<body>
    <script>
        function validateForm(event) {
            event.preventDefault(); // Mencegah form dari pengiriman otomatis

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Validasi sederhana (misalnya username dan password harus "admin")
            if (username === 'admin' && password === 'admin') {
                window.location.href = 'dashboard.html'; // Arahkan ke halaman dashboard
            } else {
                alert('Username atau password salah. Silakan coba lagi ya(•_•).'); // Peringatan jika salah
            }
            function logout() {
      // Misalnya di sini kamu bisa hapus data session (kalau pakai)
      // Lalu redirect ke halaman utama
      window.location.href = "index.html"; // Ganti dengan halaman utama kamu
    }
        }
    </script>
    <div class="login-container">
         <h2>Login dulu dong 👋</h2>
        <form onsubmit="validateForm(event)">
        <form action="#" method="POST">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="admin" placeholder="Masukkan username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="12345" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn">Masuk</button>

            <p class="signup-link">
                Belum punya akun? <a href="#">Daftar</a>
            </p>
        </form>
    </div>

</body>
</html>
